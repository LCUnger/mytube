name: Check release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - run: node --test tests/*.test.cjs
      - run: python tests/filters.py
      - run: python scripts/package.py
      - run: unzip dist/mytube-*.zip -d "$RUNNER_TEMP/mytube"
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: EXTENSION_DIR="$RUNNER_TEMP/mytube" node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: mytube-release
          path: dist/
